<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sorting A–Z Activity WebObject</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 20px;
  }
  .letter-row, .drop-row {
    display: flex;
    margin: 20px;
  }
  .letter, .drop-box {
    width: 60px;
    height: 60px;
    margin: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #333;
    border-radius: 5px;
    font-family: "Comic Sans MS", cursive;
    font-weight: bold;
    font-size: 28px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    box-sizing: border-box;
  }
  .drop-box .letter {
    width: 100%;
    height: 100%;
    margin: 0;
    border: none;
    background: transparent;
    cursor: grab;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .letter-row .letter {
    background: #fff;
  }
  .drop-box {
    background: #f0f0f0;
  }
  .dragging {
    opacity: 0.5;
  }
</style>
</head>
<body>

<div class="letter-row" id="letterRow"></div>
<div class="drop-row" id="dropRow"></div>

<script>
const COLOR_CORRECT = "#7bb77b";
const COLOR_INCORRECT = "#e07070";
const COLOR_DEFAULT = "#f0f0f0";

function getStorylinePlayer() {
  try { return parent.GetPlayer(); } catch(e){ return null; }
}
const player = getStorylinePlayer();

const letterRow = document.getElementById("letterRow");
const dropRow = document.getElementById("dropRow");

let selectedLetters = [];
let correctIndices = [];
let correctFlags = [];

function allowDrop(e) { e.preventDefault(); }

function createBox(index) {
  const box = document.createElement("div");
  box.className = "drop-box";
  box.dataset.drop = index;
  box.addEventListener("dragover", allowDrop);
  box.addEventListener("drop", handleDrop);
  box.style.backgroundColor = COLOR_DEFAULT;
  return box;
}

function createLetterElement(letter, idx) {
  const div = document.createElement("div");
  div.className = "letter";
  div.textContent = letter;
  div.dataset.letter = letter;
  div.dataset.idx = idx;
  div.draggable = true;
  div.addEventListener("dragstart", handleDragStart);
  div.addEventListener("dragend", handleDragEnd);
  return div;
}

function handleDragStart(e) {
  const el = e.target;
  if (!el || !el.dataset) return;
  e.dataTransfer.setData("text/plain", el.dataset.letter);
  el.classList.add("dragging");
}

function handleDragEnd(e) {
  if (e.target && e.target.classList)
    e.target.classList.remove("dragging");
}

function setBoxState(box, state) {
  if (state === "correct") {
    box.style.backgroundColor = COLOR_CORRECT;
  } else if (state === "incorrect") {
    box.style.backgroundColor = COLOR_INCORRECT;
  } else {
    box.style.backgroundColor = COLOR_DEFAULT;
  }
  box.dataset.state = state;
}

function updateAllCorrect() {
  const allFilled = Array.from(document.querySelectorAll(".drop-box"))
    .every(b => b.querySelector(".letter"));
  const allCorrect = correctFlags.every(f => f);
  const isAllCorrect = allFilled && allCorrect;
  player?.SetVar("AllCorrect", isAllCorrect);
  console.log("All boxes filled:", allFilled, "All correct:", allCorrect, "Final AllCorrect:", isAllCorrect);
}

function handleDrop(e) {
  e.preventDefault();
  const dropTarget = e.currentTarget;
  const draggedLetter = e.dataTransfer.getData("text/plain");
  if (!draggedLetter) return;

  // Remove letter from old box if already placed there
  const oldBox = Array.from(document.querySelectorAll(".drop-box"))
    .find(b => b.querySelector(".letter")?.dataset.letter === draggedLetter);

  if (oldBox && oldBox !== dropTarget) {
    oldBox.innerHTML = "";
    setBoxState(oldBox, "default");
  }

  // === Drop on drop box ===
  if (dropTarget.classList.contains("drop-box")) {
    if (dropTarget.querySelector(".letter")) return; // already filled

    const letterData = selectedLetters.find(l => l === draggedLetter);
    if (!letterData) return;

    const idx = selectedLetters.indexOf(draggedLetter) + 1;
    const dropNum = parseInt(dropTarget.dataset.drop);
    const correctIndex = correctIndices[idx - 1];

    // Create a *copy* of the top letter
    const movedEl = createLetterElement(draggedLetter, idx);
    dropTarget.appendChild(movedEl);

    // check correctness
    if (dropNum === correctIndex) {
      setBoxState(dropTarget, "correct");
      correctFlags[idx - 1] = true;
      player?.SetVar("IsCorrect" + idx, true);
    } else {
      setBoxState(dropTarget, "incorrect");
      correctFlags[idx - 1] = false;
      player?.SetVar("IsCorrect" + idx, false);
    }

    player?.SetVar("R" + idx, draggedLetter);
    updateAllCorrect();
    return;
  }

  // === Drop back to letter row ===
  if (dropTarget.id === "letterRow" && oldBox) {
    const letter = oldBox.querySelector(".letter");
    if (letter) {
      const idx = parseInt(letter.dataset.idx);
      correctFlags[idx - 1] = false;
      oldBox.innerHTML = "";
      setBoxState(oldBox, "default");
      updateAllCorrect();
    }
  }
}

function generateQuestion() {
  letterRow.innerHTML = "";
  dropRow.innerHTML = "";

  const allLetters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  allLetters.sort(() => Math.random() - 0.5);
  selectedLetters = allLetters.slice(0, 4);

  selectedLetters.forEach((letter, i) => {
    const el = createLetterElement(letter, i + 1);
    letterRow.appendChild(el);
  });

  for (let i = 1; i <= 4; i++) {
    const box = createBox(i);
    dropRow.appendChild(box);
  }

  const sorted = [...selectedLetters].sort();
  correctIndices = selectedLetters.map(l => sorted.indexOf(l) + 1);
  correctFlags = [false, false, false, false];
  console.log("Generated letters:", selectedLetters, "Correct indices:", correctIndices);
}

letterRow.addEventListener("dragover", allowDrop);
letterRow.addEventListener("drop", handleDrop);

generateQuestion();

setInterval(() => {
  if (player && player.GetVar("RegenerateQuestion") === true) {
    generateQuestion();
    player.SetVar("RegenerateQuestion", false);
  }
}, 200);
</script>
</body>
</html>
